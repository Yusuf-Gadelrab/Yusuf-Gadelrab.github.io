  <!-- polish2:minimal-gold -->
<style id="pv2-css">
:root{--pv2g:#d4af37;--pv2e:cubic-bezier(.22,.61,.36,1)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{letter-spacing:-.015em}
p,li{line-height:1.75}
.pv2-r{opacity:0;transform:translateY(24px);transition:opacity .7s var(--pv2e),transform .7s var(--pv2e)}
.pv2-r.pv2-in{opacity:1;transform:none}
html.pv2-nojs .pv2-r,html.pv2-red .pv2-r{opacity:1!important;transform:none!important}
a{transition:color .25s,opacity .25s,border-color .25s,text-shadow .25s}
a:hover{text-shadow:0 0 14px rgba(212,175,55,.45)}
.pv2-lift{transition:transform .35s var(--pv2e),box-shadow .35s var(--pv2e),border-color .35s}
.pv2-lift:hover{transform:translateY(-5px);box-shadow:0 14px 44px rgba(212,175,55,.13);border-color:rgba(212,175,55,.45)}
#pv2-bar{position:fixed;top:0;left:0;height:2px;width:0;z-index:99999;background:linear-gradient(90deg,#9a7b2e,#d4af37,#ffe9a8);box-shadow:0 0 12px rgba(212,175,55,.65);pointer-events:none}
#pv2-glow{position:fixed;left:-999px;top:-999px;width:560px;height:560px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(212,175,55,.065),transparent 62%);transform:translate(-50%,-50%);transition:left .16s ease-out,top .16s ease-out;mix-blend-mode:screen}
#pv2-line{position:fixed;bottom:0;left:0;right:0;height:1px;z-index:99998;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(212,175,55,.55),transparent);background-size:200% 100%;animation:pv2sweep 6s linear infinite}
@keyframes pv2sweep{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#pv2-bar,#pv2-glow,#pv2-line{display:none!important}}
@media (max-width:768px){#pv2-glow{display:none}}
</style>
<script id="pv2-js">
(function(){var d=document,H=d.documentElement;
if(matchMedia('(prefers-reduced-motion: reduce)').matches){H.classList.add('pv2-red');return}
var bar=d.createElement('div');bar.id='pv2-bar';d.body.appendChild(bar);
addEventListener('scroll',function(){var m=H.scrollHeight-H.clientHeight;bar.style.width=(m>0?(H.scrollTop||d.body.scrollTop)/m*100:0)+'%'},{passive:true});
var g=d.createElement('div');g.id='pv2-glow';d.body.appendChild(g);
addEventListener('pointermove',function(e){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'},{passive:true});
var ln=d.createElement('div');ln.id='pv2-line';d.body.appendChild(ln);
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){var el=en.target,sibs=el.parentElement?[].slice.call(el.parentElement.children):[],i=sibs.indexOf(el);el.style.transitionDelay=Math.min(i>0?i*60:0,360)+'ms';el.classList.add('pv2-in');io.unobserve(el)}})},{threshold:.12,rootMargin:'0px 0px -8% 0px'});
var SEL='section,h1,h2,h3,figure,blockquote,[class*="card"],[class*="tile"],[class*="stat"],[class*="grid"]>div,[class*="grid"]>a,main>p,section>p';
function scan(root){[].forEach.call((root||d).querySelectorAll(SEL),function(el){if(el.classList.contains('pv2-r'))return;if(el.closest('nav,#pv2-glow,[data-pv2-skip]'))return;var cs=getComputedStyle(el);if(cs.position==='fixed'||cs.position==='sticky')return;el.classList.add('pv2-r');if(/card|tile/.test(el.className))el.classList.add('pv2-lift');io.observe(el)})}
function boot(){scan(d);var r=d.getElementById('root');if(r){var t,mo=new MutationObserver(function(){clearTimeout(t);t=setTimeout(function(){scan(r)},120)});mo.observe(r,{childList:true,subtree:true})}}
d.readyState==='loading'?d.addEventListener('DOMContentLoaded',boot):boot();
})();
</script>
