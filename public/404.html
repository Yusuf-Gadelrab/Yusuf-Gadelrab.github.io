<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found | Yusuf Gadelrab</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/svg+xml" href="/favicon-automation.svg">
<style>
  :root{
    --bg:#0a0a0b; --panel:#141417;
    --gold:#d4af37; --gold-2:#f4d47a; --gold-dim:#8a7328;
    --ink:#f5f2e8; --muted:#a39f94; --line:rgba(212,175,55,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  ::selection{background:var(--gold);color:#0a0a0b}
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(55vw 38vw at 85% -8%, rgba(212,175,55,.10), transparent 62%),
      radial-gradient(45vw 32vw at 8% 108%, rgba(212,175,55,.07), transparent 60%);
  }
  .card{position:relative; z-index:1; text-align:center; max-width:560px; width:100%}
  .mark{
    width:84px; height:84px; margin:0 auto 28px; border-radius:20px;
    background:#0d0d0f; border:2px solid rgba(212,175,55,.45);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 44px rgba(212,175,55,.18) inset, 0 0 32px rgba(212,175,55,.12);
  }
  .mark span{
    font-family:Georgia,'Times New Roman',serif; font-weight:bold; font-size:52px; line-height:1;
    background:linear-gradient(135deg,var(--gold-2) 0%,var(--gold) 55%,var(--gold-dim) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    transform:translateY(-2px);
  }
  h1{
    font-family:Georgia,'Times New Roman',serif; font-size:clamp(64px,14vw,96px);
    line-height:1; letter-spacing:-1px;
    background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-dim));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  p{color:var(--muted); margin:14px 0 32px; font-size:17px}
  nav{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
  nav a{
    color:var(--ink); text-decoration:none; font-size:15px; letter-spacing:.3px;
    padding:11px 20px; border:1px solid var(--line); border-radius:999px;
    background:var(--panel); transition:border-color .2s, color .2s, box-shadow .2s;
  }
  nav a:hover{border-color:var(--gold); color:var(--gold-2); box-shadow:0 0 22px rgba(212,175,55,.18)}
  nav a.primary{background:linear-gradient(135deg,var(--gold-2),var(--gold)); color:#0a0a0b; border-color:transparent; font-weight:600}
  nav a.primary:hover{box-shadow:0 0 28px rgba(212,175,55,.4); color:#0a0a0b}
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><span>$</span></div>
    <h1>404</h1>
    <p>This page doesn't exist — but the good stuff is one click away.</p>
    <nav>
      <a class="primary" href="/">Home</a>
      <a href="/store.html">Store</a>
      <a href="/freightdesk.html">FreightDesk</a>
      <a href="/everything.html">Everything</a>
    </nav>
  </main>
</body>
</html>
