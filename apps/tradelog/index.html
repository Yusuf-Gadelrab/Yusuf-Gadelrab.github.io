<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradeLog — R Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0a0a0a;
  --card:#161616;
  --text:#f2f2f2;
  --dim:#9a9a9a;
  --gold:#d4af37;
  --gold-soft:#e8c96a;
  --border:rgba(212,175,55,.25);
  --red:#e05a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:1rem;
  padding-bottom:3rem;
}
.wrap{max-width:640px;margin:0 auto}
header{margin:1rem 0 1.25rem}
.eyebrow{
  color:var(--gold);
  letter-spacing:.25em;
  text-transform:uppercase;
  font-size:.75rem;
  font-weight:600;
}
h1{font-size:1.9rem;margin-top:.35rem}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:1rem;
  margin-bottom:1rem;
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:.5rem;
}
.stat{text-align:center;padding:.4rem .2rem}
.stat .v{font-size:1.15rem;font-weight:700;color:var(--gold-soft)}
.stat .l{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:.15rem}
form label{
  display:block;
  font-size:.72rem;
  color:var(--dim);
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:.6rem 0 .25rem;
}
input,select{
  width:100%;
  background:#111;
  color:var(--text);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:.7rem .75rem;
  font-size:1rem;
  min-height:44px;
  -webkit-appearance:none;
  appearance:none;
}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}
button{
  background:var(--gold);
  color:#000;
  font-weight:700;
  border:none;
  border-radius:10px;
  padding:.75rem 1rem;
  font-size:1rem;
  min-height:44px;
  cursor:pointer;
  font-family:inherit;
}
button:active{background:var(--gold-soft)}
.btn-full{width:100%;margin-top:.9rem}
.btn-ghost{
  background:transparent;
  color:var(--gold);
  border:1px solid var(--border);
  font-weight:600;
}
.err{color:var(--red);font-size:.85rem;margin-top:.5rem;display:none}
canvas{width:100%;height:160px;display:block}
.trade{
  display:flex;
  align-items:center;
  gap:.6rem;
  padding:.7rem .25rem;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.trade:last-child{border-bottom:none}
.trade .date{color:var(--dim);font-size:.78rem;min-width:4.6rem}
.trade .sym{font-weight:700;min-width:3.2rem}
.trade .setup{color:var(--dim);font-size:.78rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trade .r{font-weight:700;min-width:3.6rem;text-align:right}
.r.pos{color:var(--gold-soft)}
.r.neg{color:var(--red)}
.trade .del{
  background:transparent;
  color:var(--dim);
  border:none;
  font-size:1.1rem;
  min-height:44px;
  min-width:44px;
  padding:0;
}
.trade .note{display:block;color:var(--dim);font-size:.75rem;margin-top:.1rem}
.trade .main{flex:1;min-width:0}
.trade .top{display:flex;align-items:center;gap:.6rem}
.empty{color:var(--dim);text-align:center;padding:1.5rem 0;font-size:.95rem}
.io{display:flex;gap:.6rem;margin-top:.25rem}
.io button{flex:1}
#importFile{display:none}
h2{font-size:.8rem;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.6rem}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Yusuf Gadelrab &middot; Tools</div>
  <h1>TradeLog</h1>
</header>

<div class="card">
  <div class="stats" id="stats"></div>
</div>

<div class="card">
  <h2>Equity Curve (cumulative R)</h2>
  <canvas id="curve" height="160"></canvas>
</div>

<div class="card">
  <h2>Add Trade</h2>
  <form id="tradeForm">
    <div class="row2">
      <div>
        <label for="fDate">Date</label>
        <input type="date" id="fDate" required>
      </div>
      <div>
        <label for="fSymbol">Symbol</label>
        <input type="text" id="fSymbol" placeholder="AAPL" autocapitalize="characters" autocomplete="off" required>
      </div>
    </div>
    <label for="fSetup">Setup</label>
    <select id="fSetup">
      <option>AVWAP-reclaim</option>
      <option>Other</option>
    </select>
    <div class="row3">
      <div>
        <label for="fEntry">Entry</label>
        <input type="number" id="fEntry" step="any" inputmode="decimal" required>
      </div>
      <div>
        <label for="fStop">Stop</label>
        <input type="number" id="fStop" step="any" inputmode="decimal" required>
      </div>
      <div>
        <label for="fExit">Exit</label>
        <input type="number" id="fExit" step="any" inputmode="decimal" required>
      </div>
    </div>
    <label for="fNote">Note (optional)</label>
    <input type="text" id="fNote" autocomplete="off">
    <div class="err" id="formErr"></div>
    <button type="submit" class="btn-full">Log Trade</button>
  </form>
</div>

<div class="card">
  <h2>Trades</h2>
  <div id="list"></div>
  <div class="io">
    <button type="button" class="btn-ghost" id="exportBtn">Export CSV</button>
    <button type="button" class="btn-ghost" id="importBtn">Import CSV</button>
    <input type="file" id="importFile" accept=".csv,text/csv">
  </div>
</div>
</div>

<script>
(function(){
"use strict";
var KEY="tl_trades";

function load(){
  try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];}
}
function save(t){localStorage.setItem(KEY,JSON.stringify(t));}

var trades=load();

function calcR(t){return (t.exit-t.entry)/(t.entry-t.stop);}

function sorted(){
  return trades.slice().sort(function(a,b){
    return a.date<b.date?-1:a.date>b.date?1:0;
  });
}

function fmt(n){return (n>=0?"+":"")+n.toFixed(2)+"R";}

function renderStats(){
  var el=document.getElementById("stats");
  var rs=sorted().map(calcR);
  var n=rs.length;
  if(!n){
    el.innerHTML='<div class="empty" style="grid-column:1/-1;padding:.5rem 0">No trades yet</div>';
    return;
  }
  var wins=rs.filter(function(r){return r>0;}).length;
  var sum=rs.reduce(function(a,b){return a+b;},0);
  var pos=rs.filter(function(r){return r>0;}).reduce(function(a,b){return a+b;},0);
  var neg=rs.filter(function(r){return r<0;}).reduce(function(a,b){return a+b;},0);
  var pf=neg===0?"∞":(pos/Math.abs(neg)).toFixed(2);
  var streak=0;
  for(var i=rs.length-1;i>=0;i--){
    var w=rs[i]>0;
    if(i===rs.length-1){streak=w?1:-1;}
    else if((streak>0)===w&&(streak<0)===!w){streak+=w?1:-1;}
    else break;
  }
  var streakTxt=streak>0?"W"+streak:"L"+(-streak);
  var cells=[
    [n,"Trades"],
    [(100*wins/n).toFixed(0)+"%","Win %"],
    [(sum/n).toFixed(2),"Expectancy"],
    [pf,"Profit Factor"],
    [streakTxt,"Streak"]
  ];
  el.innerHTML=cells.map(function(c){
    return '<div class="stat"><div class="v">'+c[0]+'</div><div class="l">'+c[1]+'</div></div>';
  }).join("");
}

function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

function renderList(){
  var el=document.getElementById("list");
  if(!trades.length){
    el.innerHTML='<div class="empty">No trades logged yet. Add your first one above.</div>';
    return;
  }
  var rows=trades.slice().sort(function(a,b){
    return a.date<b.date?1:a.date>b.date?-1:0;
  });
  el.innerHTML=rows.map(function(t){
    var r=calcR(t);
    var cls=r>=0?"pos":"neg";
    return '<div class="trade">'+
      '<div class="main"><div class="top">'+
      '<span class="date">'+esc(t.date)+'</span>'+
      '<span class="sym">'+esc(t.symbol)+'</span>'+
      '<span class="setup">'+esc(t.setup)+'</span>'+
      '<span class="r '+cls+'">'+fmt(r)+'</span>'+
      '</div>'+(t.note?'<span class="note">'+esc(t.note)+'</span>':"")+'</div>'+
      '<button type="button" class="del" data-id="'+esc(t.id)+'" aria-label="Delete">✕</button>'+
      '</div>';
  }).join("");
}

function renderCurve(){
  var cv=document.getElementById("curve");
  var dpr=window.devicePixelRatio||1;
  var w=cv.clientWidth||300,h=160;
  cv.width=w*dpr;cv.height=h*dpr;
  var ctx=cv.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  var rs=sorted().map(calcR);
  if(!rs.length){
    ctx.fillStyle="#9a9a9a";
    ctx.font="13px -apple-system, sans-serif";
    ctx.textAlign="center";
    ctx.fillText("No data yet",w/2,h/2);
    return;
  }
  var cum=[0],acc=0;
  rs.forEach(function(r){acc+=r;cum.push(acc);});
  var min=Math.min.apply(null,cum),max=Math.max.apply(null,cum);
  if(min===max){min-=1;max+=1;}
  var pad=12;
  function x(i){return pad+(w-2*pad)*i/(cum.length-1);}
  function y(v){return h-pad-(h-2*pad)*(v-min)/(max-min);}
  if(min<0&&max>0){
    ctx.strokeStyle="rgba(255,255,255,.12)";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(pad,y(0));ctx.lineTo(w-pad,y(0));
    ctx.stroke();
  }
  ctx.strokeStyle="#d4af37";
  ctx.lineWidth=2;
  ctx.lineJoin="round";
  ctx.beginPath();
  cum.forEach(function(v,i){
    if(i===0)ctx.moveTo(x(i),y(v));else ctx.lineTo(x(i),y(v));
  });
  ctx.stroke();
  ctx.fillStyle="#e8c96a";
  var lx=x(cum.length-1),ly=y(cum[cum.length-1]);
  ctx.beginPath();
  ctx.arc(lx,ly,3,0,Math.PI*2);
  ctx.fill();
}

function render(){renderStats();renderList();renderCurve();}

document.getElementById("tradeForm").addEventListener("submit",function(e){
  e.preventDefault();
  var err=document.getElementById("formErr");
  err.style.display="none";
  var entry=parseFloat(document.getElementById("fEntry").value);
  var stop=parseFloat(document.getElementById("fStop").value);
  var exit=parseFloat(document.getElementById("fExit").value);
  if(!(entry>stop)){
    err.textContent="Entry must be greater than stop (long R math).";
    err.style.display="block";
    return;
  }
  var t={
    id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
    date:document.getElementById("fDate").value,
    symbol:document.getElementById("fSymbol").value.trim().toUpperCase(),
    setup:document.getElementById("fSetup").value,
    entry:entry,stop:stop,exit:exit,
    note:document.getElementById("fNote").value.trim()
  };
  trades.push(t);
  save(trades);
  this.reset();
  setToday();
  render();
});

document.getElementById("list").addEventListener("click",function(e){
  var btn=e.target.closest(".del");
  if(!btn)return;
  if(!confirm("Delete this trade?"))return;
  trades=trades.filter(function(t){return t.id!==btn.dataset.id;});
  save(trades);
  render();
});

function csvField(v){
  v=String(v==null?"":v);
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}

document.getElementById("exportBtn").addEventListener("click",function(){
  var head="date,symbol,setup,entry,stop,exit,note";
  var lines=trades.map(function(t){
    return [t.date,t.symbol,t.setup,t.entry,t.stop,t.exit,t.note].map(csvField).join(",");
  });
  var blob=new Blob([head+"\n"+lines.join("\n")+"\n"],{type:"text/csv"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="trades.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

function parseCSV(text){
  var rows=[],row=[],cur="",inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){cur+='"';i++;}
        else inQ=false;
      }else cur+=c;
    }else if(c==='"')inQ=true;
    else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"||c==="\r"){
      if(c==="\r"&&text[i+1]==="\n")i++;
      row.push(cur);cur="";
      if(row.length>1||row[0]!=="")rows.push(row);
      row=[];
    }else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);if(row.length>1||row[0]!=="")rows.push(row);}
  return rows;
}

document.getElementById("importBtn").addEventListener("click",function(){
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change",function(){
  var f=this.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    var rows=parseCSV(String(reader.result));
    if(!rows.length)return;
    var start=/date/i.test(rows[0][0])?1:0;
    var seen={};
    trades.forEach(function(t){seen[t.date+"|"+t.symbol+"|"+t.entry]=true;});
    var added=0;
    for(var i=start;i<rows.length;i++){
      var r=rows[i];
      if(r.length<6)continue;
      var entry=parseFloat(r[3]),stop=parseFloat(r[4]),exit=parseFloat(r[5]);
      if(!isFinite(entry)||!isFinite(stop)||!isFinite(exit)||!(entry>stop))continue;
      var key=r[0]+"|"+r[1].toUpperCase()+"|"+entry;
      if(seen[key])continue;
      seen[key]=true;
      trades.push({
        id:Date.now()+"-"+i+"-"+Math.random().toString(36).slice(2,5),
        date:r[0],symbol:r[1].toUpperCase(),setup:r[2]||"Other",
        entry:entry,stop:stop,exit:exit,note:r[6]||""
      });
      added++;
    }
    if(added){save(trades);render();}
    alert(added+" trade"+(added===1?"":"s")+" imported.");
  };
  reader.readAsText(f);
  this.value="";
});

function setToday(){
  var d=new Date();
  var pad=function(n){return n<10?"0"+n:""+n;};
  document.getElementById("fDate").value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

setToday();
render();
window.addEventListener("resize",renderCurve);

try{
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js");
  }
}catch(e){}
})();
</script>
</body>
</html>
