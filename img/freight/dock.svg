        <path d="M-10 72 h140 v-14 h-140 z"/>
        <path d="M14 236 v-24 h92 v24"/>
      </g>
      <rect x="52" y="188" width="16" height="6" fill="#e9c96a" fill-opacity=".55"/>
    </g>
  </g>
  <use href="#dkBays" x="168"/><use href="#dkBays" x="336"/><use href="#dkBays" x="504"/>
  <use href="#dkBays" x="672"/><use href="#dkBays" x="840"/><use href="#dkBays" x="1008"/>
  <use href="#dkBays" x="1176"/><use href="#dkBays" x="1344"/>
