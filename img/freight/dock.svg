<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" width="1600" height="260" preserveAspectRatio="xMidYMax slice" role="presentation" aria-hidden="true">
<defs>
<linearGradient id="dkG" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#D4AF37" stop-opacity=".30"/><stop offset="1" stop-color="#D4AF37" stop-opacity=".08"/>
</linearGradient>
<linearGradient id="dkBay" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e9c96a" stop-opacity=".16"/><stop offset="1" stop-color="#e9c96a" stop-opacity="0"/>
</linearGradient>
</defs>
<g fill="none" stroke="url(#dkG)" stroke-width="1.6" stroke-linejoin="round">
