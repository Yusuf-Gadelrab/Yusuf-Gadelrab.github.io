<!-- yard lamps -->
<g stroke="#D4AF37" stroke-opacity=".4" stroke-width="1.4" fill="none">
  <path d="M120 44 v-30 M456 44 v-30 M792 44 v-30 M1128 44 v-30 M1464 44 v-30"/>
</g>
<g fill="#ffe9a8" fill-opacity=".5">
