<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business OS — Freelance Command Center</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://yusuf-gadelrab.github.io/templates.html">
<style>
:root{
  --bg:#0a0a0b; --bg2:#111114; --panel:#141417; --panel2:#191920;
  --gold:#d4af37; --gold-2:#f4d47a; --gold-dim:#8a7328;
  --ink:#f5f2e8; --muted:#a39f94;
  --line:rgba(212,175,55,.16); --glow:rgba(212,175,55,.35);
  --paper:#fbfaf7; --paper-ink:#14140f; --paper-muted:#6b675c; --paper-line:rgba(20,20,15,.12);
  --good:#7fbf6a; --bad:#d46a4f; --warn:#e0b64a;
}
*{box-sizing:border-box;}
html,body{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  line-height:1.6;
  background-image:radial-gradient(ellipse at top right, rgba(212,175,55,.06), transparent 60%),
                    radial-gradient(ellipse at bottom left, rgba(212,175,55,.04), transparent 60%);
  background-attachment:fixed;
  min-height:100vh;
}
@media (prefers-reduced-motion: no-preference){
  .panel{transition:opacity .15s ease;}
  button, .tab, .card{transition:border-color .15s ease, background .15s ease, transform .1s ease;}
}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif; letter-spacing:-.5px; margin:0 0 4px;}
.eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-2); font-weight:600;}
.gold-text{background:linear-gradient(120deg,var(--gold-2),var(--gold) 40%,#c99b1e); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;}
a{color:var(--gold-2);}
button{
  font:inherit; cursor:pointer; color:var(--ink); background:var(--panel2);
  border:1px solid var(--line); border-radius:6px; padding:8px 14px;
}
button:hover{border-color:var(--gold-dim);}
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--gold); outline-offset:2px;
}
button.primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim)); color:#141310; border:none; font-weight:600;}
button.primary:hover{filter:brightness(1.08);}
button.ghost{background:transparent;}
button.danger{border-color:rgba(212,106,79,.5); color:#e8a591;}
button.small{padding:4px 10px; font-size:12.5px;}
input,select,textarea{
  font:inherit; background:var(--bg2); color:var(--ink); border:1px solid var(--line);
  border-radius:6px; padding:8px 10px; width:100%;
}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--gold);}
input[type=range]{accent-color:var(--gold);}
label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:4px;}
.field{margin-bottom:12px;}
.hairline{border:none; border-top:1px solid var(--line); margin:20px 0;}

/* shell */
.shell{max-width:1180px; margin:0 auto; padding:32px 24px 80px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:28px;}
.brand{display:flex; align-items:center; gap:12px;}
.mark{width:30px; height:30px; flex:none;}
.brand-name{font-family:Georgia,serif; font-size:20px; letter-spacing:-.3px; font-weight:400; margin:0;}
.brand-sub{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);}
.topbar-actions{display:flex; gap:8px; flex-wrap:wrap;}

.tabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:24px; padding-bottom:0;}
.tab{background:transparent; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; padding:10px 16px; color:var(--muted); font-size:14px;}
.tab[aria-selected="true"]{color:var(--gold-2); border-color:var(--line); background:var(--panel); font-weight:600;}
.tab:hover{color:var(--ink);}

.panel{display:none;}
.panel.active{display:block;}

.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; break-inside:avoid;}
.card + .card{margin-top:16px;}
.grid{display:grid; gap:16px;}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:20px;}
.kpi-tile{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; position:relative; overflow:hidden;}
.kpi-tile::after{content:""; position:absolute; top:-30%; right:-20%; width:120px; height:120px; background:radial-gradient(circle, var(--glow), transparent 70%); opacity:.15; pointer-events:none;}
.kpi-num{font-family:Georgia,serif; font-size:clamp(26px,3.4vw,38px); font-weight:700;}
.kpi-label{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:6px;}

/* chart */
.chart-wrap{display:flex; align-items:flex-end; gap:6px; height:160px; padding:10px 6px 0; border-bottom:1px solid var(--line);}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; min-width:0;}
.bar{width:100%; max-width:26px; background:linear-gradient(180deg,var(--gold-2),var(--gold-dim)); border-radius:3px 3px 0 0; min-height:2px;}
.bar-month{font-size:10px; color:var(--muted); white-space:nowrap;}
.bar-val{font-size:9.5px; color:var(--gold-2);}

.attn-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.attn-item{display:flex; justify-content:space-between; gap:12px; padding:10px 12px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; font-size:13.5px;}
.tag{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; padding:2px 8px; border-radius:20px; border:1px solid var(--line); white-space:nowrap;}
.tag.bad{color:#e8a591; border-color:rgba(212,106,79,.5);}
.tag.warn{color:var(--warn); border-color:rgba(224,182,74,.4);}
.tag.good{color:var(--good); border-color:rgba(127,191,106,.4);}
.tag.muted{color:var(--muted);}

/* table */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap;}
th.sortable:hover{color:var(--gold-2);}
td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.total-row td{border-top:1px solid var(--gold-dim); font-weight:700; color:var(--gold-2);}
.row-actions{display:flex; gap:6px; justify-content:flex-end;}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; justify-content:space-between;}
.toolbar-left{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

.form-card{background:var(--bg2); border:1px dashed var(--line); border-radius:10px; padding:16px; margin-bottom:16px; display:none;}
.form-card.open{display:block;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.form-actions{display:flex; gap:8px; margin-top:12px;}

/* kanban */
.kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; overflow-x:auto;}
.kcol{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px; min-height:120px;}
.kcol-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; padding:0 4px;}
.kcol-title{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold-2);}
.kcol-total{font-size:11px; color:var(--muted);}
.kcard{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px;}
.kcard-name{font-weight:600; font-size:13px;}
.kcard-client{font-size:11.5px; color:var(--muted); margin:2px 0 6px;}
.kcard-val{font-size:13px; color:var(--gold-2); margin-bottom:8px;}
.kcard-actions{display:flex; gap:6px; flex-wrap:wrap;}

/* progress meter (projects) */
.meter{background:var(--bg); border:1px solid var(--line); border-radius:20px; height:10px; overflow:hidden; flex:1;}
.meter-fill{height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold-2));}
.meter-row{display:flex; align-items:center; gap:10px;}

/* progress ring */
.ring-wrap{display:flex; align-items:center; gap:24px; flex-wrap:wrap;}
.ring-num{font-family:Georgia,serif; font-size:22px; fill:var(--gold-2);}

.empty{color:var(--muted); font-size:13.5px; padding:20px; text-align:center; border:1px dashed var(--line); border-radius:8px;}

.confirm-inline{display:inline-flex; gap:6px; align-items:center; background:var(--bg2); border:1px solid rgba(212,106,79,.5); border-radius:6px; padding:4px 6px;}
.confirm-inline span{font-size:12px; color:#e8a591;}

.habit-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.habit-item{display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--bg2); border:1px solid var(--line); border-radius:8px;}
.habit-item.done label{color:var(--muted); text-decoration:line-through;}
.habit-item label{margin:0; color:var(--ink); font-size:13.5px; flex:1;}

.footer-note{margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

.toast{position:fixed; bottom:20px; right:20px; background:var(--panel); border:1px solid var(--gold-dim); color:var(--ink); padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; transform:translateY(8px); pointer-events:none; z-index:50;}
@media (prefers-reduced-motion: no-preference){.toast{transition:opacity .2s ease, transform .2s ease;}}
.toast.show{opacity:1; transform:translateY(0);}

.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
.billable-yes{color:var(--good);}
.billable-no{color:var(--muted);}

@media (max-width:720px){
  .kanban{grid-template-columns:1fr;}
  table{font-size:12.5px;}
  th,td{padding:8px 6px;}
}
</style>
<style>@media screen{.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.tbl-scroll:focus-visible{outline:2px solid #D4AF37;outline-offset:2px}}</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="4" fill="none" stroke="#d4af37" stroke-width="1.2"/><path d="M14 5 L21 14 L14 23 L7 14 Z" fill="none" stroke="#f4d47a" stroke-width="1.2"/></svg>
      <div>

    <button class="tab" role="tab" data-tab="timelog" aria-selected="false">Time Log</button>

  <main id="panels"></main>

  <div class="footer-note">
    <span>Your Business · CONFIDENTIAL · data stored only in this browser</span>
    <span>Business OS by Yusuf Gadelrab</span>
  </div>
</div>

<script>
(function(){
"use strict";

function uid(){ return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9); }
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtMoney(n){
  n = Number(n)||0;
  return "$" + n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtMoneyShort(n){
  n = Number(n)||0;
  if (Math.abs(n) >= 1000) return "$" + (n/1000).toFixed(1).replace(/\.0$/,"") + "k";
  return "$" + Math.round(n);
}
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
}
function todayISO(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
function daysAgo(iso){
  if(!iso) return Infinity;
  var d = new Date(iso + "T00:00:00");
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function isPast(iso){
  if(!iso) return false;
  return iso < todayISO();
}
function clientName(id, state){
  var c = state.clients.find(function(x){ return x.id === id; });
  return c ? c.name : "(no client)";
}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

  return {

function emptyState(){
  return {
    version: SCHEMA_VERSION,
    clients: [], deals: [], projects: [], invoices: [], timeLogs: [],
    goal: { monthlyTarget: 10000, habits: [] }
  };
}

/* ---------- storage ---------- */
function migrate(state){
  if (!state.version) state.version = 1;
  if (!Array.isArray(state.clients)) state.clients = [];
  if (!Array.isArray(state.deals)) state.deals = [];
  if (!Array.isArray(state.projects)) state.projects = [];
  if (!Array.isArray(state.invoices)) state.invoices = [];
  if (!Array.isArray(state.timeLogs)) state.timeLogs = [];
  if (!state.goal) state.goal = {monthlyTarget:10000, habits:[]};
  if (typeof state.goal.monthlyTarget !== "number") state.goal.monthlyTarget = 10000;
  if (!Array.isArray(state.goal.habits)) state.goal.habits = [];
  state.clients.forEach(function(c){ if(!c.lastActivity) c.lastActivity = todayISO(); });
  state.version = SCHEMA_VERSION;
  return state;
}

var state;
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return demoState();
    var parsed = JSON.parse(raw);
    return migrate(parsed);
  } catch(e){
    console.error("Business OS: failed to load state, falling back to demo data", e);
    return demoState();
  }
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){
    console.error("Business OS: failed to save state", e);
    toast("Save failed — storage may be full or blocked.");
  }
}

/* ---------- derived data ---------- */
function activeClients(){ return state.clients.filter(function(c){ return c.status === "active"; }); }
function openDeals(){ return state.deals.filter(function(d){ return d.stage !== "won" && d.stage !== "lost"; }); }
function weightedPipelineTotal(){
  return openDeals().reduce(function(sum,d){ return sum + (Number(d.value)||0) * STAGE_WEIGHT[d.stage]; }, 0);
}
function outstandingInvoices(){ return state.invoices.filter(function(i){ return i.status !== "paid"; }); }
function invoiceDisplayStatus(inv){
  if (inv.status === "paid") return "paid";
  if (isPast(inv.due)) return "overdue";
  return inv.status;
}
function revenueInMonth(ym){
  return state.invoices.filter(function(i){ return i.status==="paid" && monthKey(i.issued)===ym; })
    .reduce(function(s,i){ return s + (Number(i.amount)||0); }, 0);
}
function revenueYTD(){
  var y = new Date().getFullYear();
  return state.invoices.filter(function(i){
    return i.status==="paid" && i.issued && new Date(i.issued+"T00:00:00").getFullYear() === y;
  }).reduce(function(s,i){ return s + (Number(i.amount)||0); }, 0);
}
function last12Months(){
  var out = [];
  var now = new Date();
  for (var i=11; i>=0; i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var ym = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    out.push({ym:ym, label:MONTHS[d.getMonth()]});
  }
  return out;
}
function unbilledValue(){
  return state.timeLogs.filter(function(t){ return t.billable; })
    .reduce(function(s,t){ return s + (Number(t.hours)||0) * (Number(t.rate)||0); }, 0);
}

/* ---------- generic UI helpers ---------- */
function inlineConfirm(container, label, onConfirm){
  container.innerHTML = "";
  var wrap = document.createElement("span");
  wrap.className = "confirm-inline";
  var span = document.createElement("span");
  span.textContent = label;
  var yes = document.createElement("button");
  yes.type = "button"; yes.className = "small danger"; yes.textContent = "Confirm";
  var no = document.createElement("button");
  no.type = "button"; no.className = "small ghost"; no.textContent = "Cancel";
  wrap.appendChild(span); wrap.appendChild(yes); wrap.appendChild(no);
  container.appendChild(wrap);
  function cleanup(){ container.innerHTML = ""; }
  yes.addEventListener("click", function(){ cleanup(); onConfirm(); });
  no.addEventListener("click", cleanup);
  yes.focus();
}

renderers.dashboard = function(el){
  var pipelineVal = weightedPipelineTotal();
  var outstanding = outstandingInvoices().reduce(function(s,i){ return s + (Number(i.amount)||0); }, 0);
  var thisMonthYm = todayISO().slice(0,7);
  var revMonth = revenueInMonth(thisMonthYm);
  var revYtd = revenueYTD();

  var months = last12Months();
  var maxVal = Math.max.apply(null, months.map(function(m){ return revenueInMonth(m.ym); }).concat([1]));
  var bars = months.map(function(m){
    var v = revenueInMonth(m.ym);
    var h = maxVal > 0 ? Math.max(2, Math.round((v/maxVal)*130)) : 2;
    return '<div class="bar-col"><div class="bar-val">'+ (v>0? fmtMoneyShort(v):"") +'</div><div class="bar" style="height:'+h+'px"></div><div class="bar-month">'+m.label+'</div></div>';
  }).join("");

  var overdueInv = state.invoices.filter(function(i){ return i.status!=="paid" && isPast(i.due); });
  var staleLeads = state.clients.filter(function(c){ return c.status==="lead" && daysAgo(c.lastActivity) >= 14; });
  var attnItems = [];
  overdueInv.forEach(function(i){
    attnItems.push({label: i.number + " — " + clientName(i.clientId,state) + " (" + fmtMoney(i.amount) + ")", tag:"OVERDUE", cls:"bad", days: daysAgo(i.due)});
  });
  staleLeads.forEach(function(c){
    attnItems.push({label: c.name + " — no activity in " + daysAgo(c.lastActivity) + " days", tag:"STALE LEAD", cls:"warn", days: daysAgo(c.lastActivity)});
  });
  attnItems.sort(function(a,b){ return b.days - a.days; });

  el.innerHTML =
    '<div class="grid kpis">' +
      kpiTile(activeClients().length, "Active Clients") +
      kpiTile(fmtMoneyShort(pipelineVal), "Weighted Pipeline") +
      kpiTile(fmtMoneyShort(outstanding), "Outstanding Invoices") +
      kpiTile(fmtMoneyShort(revMonth), "Revenue This Month") +
      kpiTile(fmtMoneyShort(revYtd), "Revenue YTD") +
    '</div>' +
    '<div class="card">' +
      '<div class="eyebrow">Last 12 Months</div><h3>Revenue</h3>' +
      (maxVal>0 ? '<div class="chart-wrap">'+bars+'</div>' : '<p class="empty">No paid invoices yet — the chart will populate as invoices are marked paid.</p>') +
    '</div>' +
    '<div class="card" style="margin-top:16px;">' +
      '<div class="eyebrow">Needs Attention</div><h3>Follow Up</h3>' +
      (attnItems.length ?
        '<ul class="attn-list">' + attnItems.map(function(a){
          return '<li class="attn-item"><span>'+escapeHtml(a.label)+'</span><span class="tag '+a.cls+'">'+a.tag+'</span></li>';
        }).join("") + '</ul>'
        : '<p class="empty">Nothing needs attention right now. Nice.</p>') +
    '</div>';
};

function kanbanBoard(){

    var deals = state.deals.filter(function(d){ return d.stage===stage; });

      '<div class="kcol-head"><span class="kcol-title">'+STAGE_LABEL[stage]+'</span><span class="kcol-total">'+fmtMoneyShort(total)+'</span></div>' +
      (deals.length ? deals.map(function(d){ return dealCard(d, stage); }).join("") : '<p class="empty" style="padding:10px;font-size:12px;">Empty</p>') +
    '</div>';
  }).join("") + '</div>';

function dealCard(d, stage){
  var idx = STAGES.indexOf(stage);
  var nextStage = (idx>=0 && idx<STAGES.length-1) ? STAGES[idx+1] : null;
  var actions = "";
  if (stage !== "won" && stage !== "lost"){
    if (nextStage) actions += '<button class="small ghost" data-advance="'+d.id+'" data-to="'+nextStage+'" type="button">Advance →</button>';
    else actions += '<button class="small ghost" data-advance="'+d.id+'" data-to="won" type="button">Mark Won</button>';
    actions += '<button class="small danger" data-advance="'+d.id+'" data-to="lost" type="button">Mark Lost</button>';
  } else {
    actions += '<button class="small ghost" data-advance="'+d.id+'" data-to="lead" type="button">Reopen</button>';
  }
  actions += '<button class="small ghost" data-edit-deal="'+d.id+'" type="button">Edit</button>';
  return '<div class="kcard">' +
    '<div class="kcard-name">'+escapeHtml(d.title)+'</div>' +
    '<div class="kcard-client">'+escapeHtml(clientName(d.clientId,state))+'</div>' +
    '<div class="kcard-val">'+fmtMoney(d.value)+'</div>' +
    '<div class="kcard-actions">'+actions+'</div>' +
  '</div>';
}

      '<td>'+fmtDate(p.deadline)+(overdue?' <span class="tag bad">LATE</span>':'')+'</td>' +
      '<td style="min-width:160px;"><div class="meter-row"><div class="meter"><div class="meter-fill" style="width:'+p.percent+'%"></div></div>' +
        '<input type="range" min="0" max="100" value="'+p.percent+'" data-percent="'+p.id+'" style="width:70px;" aria-label="Percent complete for '+escapeHtml(p.name)+'"><span style="font-size:12px;color:var(--muted);min-width:34px;">'+p.percent+'%</span></div></td>' +
      '<td><span class="tag '+(p.status==="complete"?"good":p.status==="on hold"?"warn":"")+'">'+cap(p.status)+'</span></td>' +
      '<td><div class="row-actions"><button class="small ghost" data-edit="'+p.id+'" type="button">Edit</button>' +
        '<span class="del-zone" data-zone="'+p.id+'"><button class="small danger" data-del="'+p.id+'" type="button">Delete</button></span></div></td>' +
    '</tr>';
  }).join("");
  return '<div style="overflow-x:auto;"><div class="tbl-scroll" tabindex="0" role="region" aria-label="Scrollable table"><table><thead><tr><th>Project</th><th>Client</th><th>Deadline</th><th>Progress</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function wireProjectTable(el){
  el.querySelectorAll("[data-percent]").forEach(function(r){
    r.addEventListener("input", function(){
      var p = state.projects.find(function(x){return x.id===r.dataset.percent;});
      p.percent = Number(r.value);
      var row = r.closest("tr");
      row.querySelector(".meter-fill").style.width = p.percent+"%";
      row.querySelector(".meter-row span:last-child").textContent = p.percent+"%";
    });
    r.addEventListener("change", function(){ saveState(); renderActivePanel(); });
  });
  el.querySelectorAll("[data-edit]").forEach(function(b){
    b.addEventListener("click", function(){ editingProjectId = b.dataset.edit; renderActivePanel(); });
  });
  el.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click", function(){
      var zone = el.querySelector('[data-zone="'+b.dataset.del+'"]');
      inlineConfirm(zone, "Delete project?", function(){
        state.projects = state.projects.filter(function(p){ return p.id !== b.dataset.del; });
        saveState(); toast("Project deleted."); renderActivePanel();
      });
    });
  });
}

/* ================= INVOICES ================= */
var editingInvoiceId = null;

renderers.invoices = function(el){
  var editing = editingInvoiceId && editingInvoiceId!=="__new__" ? state.invoices.find(function(i){return i.id===editingInvoiceId;}) : null;
  var totalAmount = state.invoices.reduce(function(s,i){return s+(Number(i.amount)||0);},0);
  var totalPaid = state.invoices.filter(function(i){return i.status==="paid";}).reduce(function(s,i){return s+(Number(i.amount)||0);},0);
  var totalOutstanding = totalAmount - totalPaid;

  el.innerHTML = '<div class="card">' +
    '<div class="toolbar"><h3 style="margin:0;">Invoices</h3><button class="primary small" id="btn-add-invoice" type="button">+ Add Invoice</button></div>' +
    invoiceForm(editing) +
    (state.invoices.length ? invoiceTable(totalAmount, totalPaid, totalOutstanding) : '<p class="empty">No invoices yet.</p>') +
  '</div>';
  document.getElementById("btn-add-invoice").addEventListener("click", function(){ editingInvoiceId="__new__"; renderActivePanel(); });
  wireInvoiceForm(el);
  wireInvoiceTable(el);
};

function invoiceForm(editing){
  if (!editingInvoiceId) return "";
  if (!state.clients.length) return '<div class="form-card open"><p class="empty">Add a client first.</p></div>';
  var isNew = editingInvoiceId === "__new__";
  var nextNum = "INV-" + (1000 + state.invoices.length + 1);
  var i = editing || {number:nextNum, clientId:state.clients[0].id, amount:0, issued:todayISO(), due:todayISO(), status:"draft"};
  return '<div class="form-card open" id="invoice-form">' +
    '<div class="form-grid">' +
      field("Invoice #", '<input id="if-number" value="'+escapeHtml(i.number)+'">') +
      field("Client", '<select id="if-client">'+state.clients.map(function(c){return '<option value="'+c.id+'"'+(i.clientId===c.id?" selected":"")+'>'+escapeHtml(c.name)+'</option>';}).join("")+'</select>') +
      field("Amount ($)", '<input id="if-amount" type="number" min="0" step="1" value="'+(i.amount||0)+'">') +
      field("Issued", '<input id="if-issued" type="date" value="'+i.issued+'">') +
      field("Due", '<input id="if-due" type="date" value="'+i.due+'">') +
      field("Status", '<select id="if-status">'+INVOICE_STATUSES.map(function(s){return '<option value="'+s+'"'+(i.status===s?" selected":"")+'>'+cap(s)+'</option>';}).join("")+'</select>') +
    '</div>' +
    '<div class="form-actions">' +
      '<button class="primary small" id="if-save" type="button">'+(isNew?"Add Invoice":"Save Changes")+'</button>' +
      '<button class="ghost small" id="if-cancel" type="button">Cancel</button>' +
    '</div>' +
  '</div>';
}
function wireInvoiceForm(el){
  var form = document.getElementById("invoice-form");
  if (!form) return;
  document.getElementById("if-cancel").addEventListener("click", function(){ editingInvoiceId=null; renderActivePanel(); });
  document.getElementById("if-save").addEventListener("click", function(){
    var number = document.getElementById("if-number").value.trim();
    if (!number){ toast("Invoice number is required."); return; }
    var data = {
      number: number,
      clientId: document.getElementById("if-client").value,
      amount: Number(document.getElementById("if-amount").value)||0,
      issued: document.getElementById("if-issued").value || todayISO(),
      due: document.getElementById("if-due").value || todayISO(),
      status: document.getElementById("if-status").value
    };
    if (editingInvoiceId === "__new__"){ data.id = uid(); state.invoices.push(data); toast("Invoice added."); }
    else { Object.assign(state.invoices.find(function(i){return i.id===editingInvoiceId;}), data); toast("Invoice updated."); }
    saveState(); editingInvoiceId = null; renderActivePanel();
  });
}
function invoiceTable(totalAmount, totalPaid, totalOutstanding){
  var rows = state.invoices.map(function(i){
    var disp = invoiceDisplayStatus(i);
    var cls = disp==="paid"?"good":disp==="overdue"?"bad":disp==="sent"?"warn":"muted";
    return '<tr data-id="'+i.id+'">' +
      '<td>'+escapeHtml(i.number)+'</td>' +
      '<td>'+escapeHtml(clientName(i.clientId,state))+'</td>' +
      '<td>'+fmtMoney(i.amount)+'</td>' +
      '<td>'+fmtDate(i.issued)+'</td>' +
      '<td>'+fmtDate(i.due)+'</td>' +
      '<td><span class="tag '+cls+'">'+cap(disp)+'</span></td>' +
      '<td><div class="row-actions">' +
        (i.status!=="paid" ? '<button class="small ghost" data-markpaid="'+i.id+'" type="button">Mark Paid</button>' : "") +
        '<button class="small ghost" data-edit="'+i.id+'" type="button">Edit</button>' +
        '<span class="del-zone" data-zone="'+i.id+'"><button class="small danger" data-del="'+i.id+'" type="button">Delete</button></span>' +
      '</div></td>' +
    '</tr>';
  }).join("");
  return '<div style="overflow-x:auto;"><div class="tbl-scroll" tabindex="0" role="region" aria-label="Scrollable table"><table><thead><tr><th>#</th><th>Client</th><th>Amount</th><th>Issued</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>'+rows+
    '<tr class="total-row"><td colspan="2">Totals</td><td>'+fmtMoney(totalAmount)+'</td><td colspan="2"></td><td colspan="2">Paid '+fmtMoney(totalPaid)+' · Outstanding '+fmtMoney(totalOutstanding)+'</td></tr>' +
    '</tbody></table></div></div>';
}
function wireInvoiceTable(el){
  el.querySelectorAll("[data-markpaid]").forEach(function(b){
    b.addEventListener("click", function(){
      var inv = state.invoices.find(function(i){return i.id===b.dataset.markpaid;});
      inv.status = "paid"; saveState(); toast("Invoice marked paid."); renderActivePanel();
    });
  });
  el.querySelectorAll("[data-edit]").forEach(function(b){
    b.addEventListener("click", function(){ editingInvoiceId = b.dataset.edit; renderActivePanel(); });
  });
  el.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click", function(){
      var zone = el.querySelector('[data-zone="'+b.dataset.del+'"]');
      inlineConfirm(zone, "Delete invoice?", function(){
        state.invoices = state.invoices.filter(function(i){ return i.id !== b.dataset.del; });
        saveState(); toast("Invoice deleted."); renderActivePanel();
      });
    });
  });
}

/* ================= TIME LOG ================= */
var editingTimeId = null;

renderers.timelog = function(el){
  var editing = editingTimeId && editingTimeId!=="__new__" ? state.timeLogs.find(function(t){return t.id===editingTimeId;}) : null;
  el.innerHTML = '<div class="grid kpis" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">' +
      kpiTile(fmtMoneyShort(unbilledValue()), "Unbilled Value") +
      kpiTile(state.timeLogs.reduce(function(s,t){return s+(Number(t.hours)||0);},0).toFixed(1)+"h", "Total Hours Logged") +
    '</div>' +
    '<div class="card">' +
    '<div class="toolbar"><h3 style="margin:0;">Time Log</h3><button class="primary small" id="btn-add-time" type="button">+ Add Entry</button></div>' +
    timeForm(editing) +
    (state.timeLogs.length ? timeTable() : '<p class="empty">No time entries yet.</p>') +
    '</div>';
  document.getElementById("btn-add-time").addEventListener("click", function(){ editingTimeId="__new__"; renderActivePanel(); });
  wireTimeForm(el);
  wireTimeTable(el);
};
function timeForm(editing){
  if (!editingTimeId) return "";
  if (!state.clients.length) return '<div class="form-card open"><p class="empty">Add a client first.</p></div>';
  var isNew = editingTimeId === "__new__";
  var t = editing || {date:todayISO(), clientId:state.clients[0].id, hours:1, rate:100, billable:true};
  return '<div class="form-card open" id="time-form">' +
    '<div class="form-grid">' +
      field("Date", '<input id="tf-date" type="date" value="'+t.date+'">') +
      field("Client", '<select id="tf-client">'+state.clients.map(function(c){return '<option value="'+c.id+'"'+(t.clientId===c.id?" selected":"")+'>'+escapeHtml(c.name)+'</option>';}).join("")+'</select>') +
      field("Hours", '<input id="tf-hours" type="number" min="0" step="0.25" value="'+t.hours+'">') +
      field("Rate ($/hr)", '<input id="tf-rate" type="number" min="0" step="1" value="'+t.rate+'">') +
    '</div>' +
    '<label style="display:flex;align-items:center;gap:8px;margin-top:8px;"><input type="checkbox" id="tf-billable" '+(t.billable?"checked":"")+'> <span style="color:var(--ink);">Billable</span></label>' +
    '<div class="form-actions">' +
      '<button class="primary small" id="tf-save" type="button">'+(isNew?"Add Entry":"Save Changes")+'</button>' +
      '<button class="ghost small" id="tf-cancel" type="button">Cancel</button>' +
    '</div>' +
  '</div>';
}
function wireTimeForm(el){
  var form = document.getElementById("time-form");
  if (!form) return;
  document.getElementById("tf-cancel").addEventListener("click", function(){ editingTimeId=null; renderActivePanel(); });
  document.getElementById("tf-save").addEventListener("click", function(){
    var data = {
      date: document.getElementById("tf-date").value || todayISO(),
      clientId: document.getElementById("tf-client").value,
      hours: Number(document.getElementById("tf-hours").value)||0,
      rate: Number(document.getElementById("tf-rate").value)||0,
      billable: document.getElementById("tf-billable").checked
    };
    if (editingTimeId === "__new__"){ data.id = uid(); state.timeLogs.push(data); toast("Entry added."); }
    else { Object.assign(state.timeLogs.find(function(t){return t.id===editingTimeId;}), data); toast("Entry updated."); }
    saveState(); editingTimeId = null; renderActivePanel();
  });
}
function timeTable(){
  var rows = state.timeLogs.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).map(function(t){
    return '<tr data-id="'+t.id+'">' +
      '<td>'+fmtDate(t.date)+'</td>' +
      '<td>'+escapeHtml(clientName(t.clientId,state))+'</td>' +
      '<td>'+t.hours+'h</td>' +
      '<td>'+fmtMoney(t.rate)+'/hr</td>' +
      '<td>'+fmtMoney((Number(t.hours)||0)*(Number(t.rate)||0))+'</td>' +
      '<td><span class="'+(t.billable?"billable-yes":"billable-no")+'">'+(t.billable?"Billable":"Non-billable")+'</span></td>' +
      '<td><div class="row-actions"><button class="small ghost" data-edit="'+t.id+'" type="button">Edit</button>' +
        '<span class="del-zone" data-zone="'+t.id+'"><button class="small danger" data-del="'+t.id+'" type="button">Delete</button></span></div></td>' +
    '</tr>';
  }).join("");
  return '<div style="overflow-x:auto;"><div class="tbl-scroll" tabindex="0" role="region" aria-label="Scrollable table"><table><thead><tr><th>Date</th><th>Client</th><th>Hours</th><th>Rate</th><th>Value</th><th>Billable</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function wireTimeTable(el){
  el.querySelectorAll("[data-edit]").forEach(function(b){
    b.addEventListener("click", function(){ editingTimeId = b.dataset.edit; renderActivePanel(); });
  });
  el.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click", function(){
      var zone = el.querySelector('[data-zone="'+b.dataset.del+'"]');
      inlineConfirm(zone, "Delete entry?", function(){
        state.timeLogs = state.timeLogs.filter(function(t){ return t.id !== b.dataset.del; });
        saveState(); toast("Entry deleted."); renderActivePanel();
      });
    });
  });
}

/* ================= GOALS ================= */
renderers.goals = function(el){
  var thisMonthYm = todayISO().slice(0,7);
  var rev = revenueInMonth(thisMonthYm);
  var target = Number(state.goal.monthlyTarget)||0;
  var pct = target > 0 ? Math.min(100, Math.round((rev/target)*100)) : 0;
  var r = 54, c = 2*Math.PI*r;
  var offset = c - (pct/100)*c;

  el.innerHTML = '<div class="card">' +
    '<div class="eyebrow">Monthly Target</div><h3>Revenue Goal</h3>' +
    '<div class="ring-wrap">' +
      '<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="'+pct+'% of monthly goal reached">' +
        '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="12"/>' +
        '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" ' +
          'stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 70 70)"/>' +
        '<defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f4d47a"/><stop offset="100%" stop-color="#8a7328"/></linearGradient></defs>' +
        '<text x="70" y="76" text-anchor="middle" class="ring-num">'+pct+'%</text>' +
      '</svg>' +
      '<div>' +
        '<div style="font-size:14px;margin-bottom:6px;">'+fmtMoney(rev)+' of '+fmtMoney(target)+' this month</div>' +
        '<div class="field" style="max-width:220px;"><label>Monthly Target ($)</label><input id="goal-target" type="number" min="0" step="100" value="'+target+'"></div>' +
        '<button class="small primary" id="goal-save" type="button">Save Target</button>' +
      '</div>' +
    '</div>' +
  '</div>' +
  '<div class="card" style="margin-top:16px;">' +
    '<div class="toolbar"><h3 style="margin:0;">Weekly Habit Checklist</h3><button class="primary small" id="btn-add-habit" type="button">+ Add Habit</button></div>' +
    '<div class="form-card" id="habit-form"><div class="form-grid"><div class="field"><label>New habit</label><input id="hf-text" placeholder="e.g. Send weekly client update"></div></div>' +
      '<div class="form-actions"><button class="primary small" id="hf-save" type="button">Add</button><button class="ghost small" id="hf-cancel" type="button">Cancel</button></div></div>' +
    (state.goal.habits.length ? habitList() : '<p class="empty">No habits yet — add a few weekly actions to stay consistent.</p>') +
  '</div>';

  document.getElementById("goal-save").addEventListener("click", function(){
    state.goal.monthlyTarget = Number(document.getElementById("goal-target").value)||0;
    saveState(); toast("Target saved."); renderActivePanel();
  });
  document.getElementById("btn-add-habit").addEventListener("click", function(){
    document.getElementById("habit-form").classList.add("open");
  });
  document.getElementById("hf-cancel").addEventListener("click", function(){
    document.getElementById("habit-form").classList.remove("open");
  });
  document.getElementById("hf-save").addEventListener("click", function(){
    var txt = document.getElementById("hf-text").value.trim();
    if (!txt) return;
    state.goal.habits.push({id:uid(), text:txt, done:false});
    saveState(); renderActivePanel();
  });
  wireHabits(el);
};
function habitList(){
  return '<ul class="habit-list">' + state.goal.habits.map(function(h){
    return '<li class="habit-item'+(h.done?" done":"")+'"><input type="checkbox" id="habit-'+h.id+'" data-habit="'+h.id+'" '+(h.done?"checked":"")+'>' +
      '<label for="habit-'+h.id+'">'+escapeHtml(h.text)+'</label>' +
      '<span class="del-zone" data-zone="'+h.id+'"><button class="small danger" data-delhabit="'+h.id+'" type="button">Remove</button></span></li>';
  }).join("") + '</ul>';
}
function wireHabits(el){
  el.querySelectorAll("[data-habit]").forEach(function(cb){
    cb.addEventListener("change", function(){
      var h = state.goal.habits.find(function(x){return x.id===cb.dataset.habit;});
      h.done = cb.checked; saveState(); renderActivePanel();
    });
  });
  el.querySelectorAll("[data-delhabit]").forEach(function(b){
    b.addEventListener("click", function(){
      var zone = el.querySelector('[data-zone="'+b.dataset.delhabit+'"]');
      inlineConfirm(zone, "Remove?", function(){
        state.goal.habits = state.goal.habits.filter(function(h){ return h.id !== b.dataset.delhabit; });
        saveState(); renderActivePanel();
      });
    });
  });
}

/* ================= TOP-LEVEL ACTIONS ================= */
document.getElementById("btn-export-json").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "business-os-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Backup downloaded.");
});

document.getElementById("input-import-json").addEventListener("change", function(e){
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      if (!parsed || typeof parsed !== "object") throw new Error("not an object");
      state = migrate(parsed);
      saveState();
      toast("Data imported.");
      renderActivePanel();
    } catch(err){
      toast("Import failed — invalid JSON file.");
      console.error(err);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

document.getElementById("btn-export-csv").addEventListener("click", function(){
  var header = ["Invoice #","Client","Amount","Issued","Due","Status"];
  var lines = [header.join(",")];
  state.invoices.forEach(function(i){
    var row = [i.number, clientName(i.clientId,state), (Number(i.amount)||0).toFixed(2), i.issued, i.due, invoiceDisplayStatus(i)];
    lines.push(row.map(function(v){
      var s = String(v==null?"":v);
      if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
      return s;
    }).join(","));
  });
  var blob = new Blob([lines.join("\n")], {type:"text/csv"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "invoices-"+todayISO()+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Invoices CSV downloaded.");
});

var resetZone = document.getElementById("reset-zone");
function renderResetButton(){
  resetZone.innerHTML = '<button class="ghost small" id="btn-reset" type="button">Reset to Empty</button>';
  document.getElementById("btn-reset").addEventListener("click", function(){
    inlineConfirm(resetZone, "Erase all data?", function(){
      state = emptyState();
      saveState();
      toast("Data cleared. Starting fresh.");
      renderActivePanel();
      renderResetButton();
    });
  });
}
renderResetButton();

/* ---------- init ---------- */
state = loadState();
saveState();
renderActivePanel();

})();
</script>
